org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# Our own UI is framework Views only — no AndroidX, no Compose.
# See docs/SPIKE_TEST_GUIDE.md §2.4 for why.
#
# AndroidX support still has to be switched on, because the one external
# dependency brings it in transitively:
#   ai.picovoice:porcupine-android -> ai.picovoice:android-voice-processor
#                                  -> androidx.core:core
# Without this flag :app:checkDebugAarMetadata fails the build outright.
# Jetifier is deliberately NOT enabled: nothing here uses the old
# com.android.support library, so there is nothing to rewrite.
android.useAndroidX=true
