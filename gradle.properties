org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# The UI we write is framework Views only — no Compose, no third-party UI
# dependency, no androidx import anywhere in app/src. The reasoning is kept
# where that choice actually lives:
#   app/src/main/kotlin/com/ssain3d/gptvoicereceiver/debug/Ui.kt
#
# That is a statement about our own source, and it says nothing about what the
# dependency graph resolves to. The two must not be conflated, because the graph
# does contain AndroidX: the one declared external dependency drags it in.
#   ai.picovoice:porcupine-android -> ai.picovoice:android-voice-processor
#                                  -> androidx.core:core
# So AndroidX support has to be switched on. Without this flag
# :app:checkDebugAarMetadata fails the build outright.
#
# Jetifier is deliberately NOT enabled: androidx.core is already an AndroidX
# artifact, and nothing here uses the old com.android.support library, so there
# is nothing for it to rewrite.
android.useAndroidX=true
